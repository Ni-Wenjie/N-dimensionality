name: Bug report
description: 报告 ms() / parse() / format() 的可复现行为问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全问题请改用 SECURITY.md 的私有渠道，不要在此提交。
  - type: input
    id: version
    attributes:
      label: 版本
      description: package.json 中的版本号或安装的 npm 版本
      placeholder: "4.0.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: 运行环境
      placeholder: "Node.js 22.x / pnpm 10.x / linux"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现代码
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
