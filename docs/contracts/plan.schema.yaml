# docs/contracts/plan.schema.yaml
# 执行层产物契约：优化计划 YAML 必须符合本文件。TEST PROFILE 实例化。
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ndl:contract:plan:v2.0"
title: NDL 优化计划（执行层）
type: object
required: [kind, spec, profile, node_id, plan_id, route_id, plan_slug, branch, generated_at, tasks, gate]
additionalProperties: false
properties:
  kind: { type: string, const: "plan" }
  spec: { type: string, const: "NDL-SPEC-0001 v2.0" }
  profile: { type: string, const: "TEST" }
  node_id: { type: string, pattern: "^NODE-[0-9]{8}-[0-9a-f]{4}-[a-z0-9-]+$" }
  plan_id: { type: string, pattern: "^PLAN-[0-9]{8}-[0-9a-f]{4}$" }
  route_id: { type: string, pattern: "^ROUTE-[0-9]{8}-[0-9a-f]{4}$" }
  plan_slug: { type: string, pattern: "^[a-z0-9-]+$" }
  branch: { type: string, minLength: 1 }
  generated_at: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} \\+0800$" }
  tasks:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, path, action, verify, rollback, status, md_note]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^T-[0-9]{3}$" }
        path: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
        verify:
          type: object
          required: [cmd, expect]
          additionalProperties: false
          properties:
            cmd: { type: string, minLength: 1 }
            expect: { type: string, enum: [exit0, nonempty] }
        rollback: { type: string, minLength: 1 }
        status: { type: string, enum: [pending, passed, failed, skipped] }
        md_note: { type: string, minLength: 1 }
  gate:
    type: object
    required: [f2_precondition, on_unclean, on_auth_failure]
    additionalProperties: false
    properties:
      f2_precondition: { type: string, const: "所有 task.status == passed 且 git status --porcelain 为空" }
      on_unclean: { type: string, const: "BLOCKED_NO_VALIDATED_PLAN" }
      on_auth_failure: { type: string, const: "BLOCKED_AUTH" }
